<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Portal exclusivo · Dra. Luizzi Di Moraes</title>
<link rel="preload" href="fonts/jost.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Jost";src:url("fonts/jost.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Cormorant Garamond";src:url("fonts/cormorant.woff2") format("woff2");font-weight:300 700;font-style:normal;font-display:swap}
/* Layout e tipografia seguem a referência FinSet. Cores: paleta Maison Rosé (rosé + vinho). */
:root{
  --bg:#f6eeeb; --card:#ffffff; --card-solid:#ffffff; --soft:#f9f1ee; --track:#f1e6e3;
  --ink:#1f1518; --ink-2:#5f5256; --ink-3:#74646b; --line:rgba(70,35,45,.10); --hi:rgba(255,255,255,.9);
  --tint:#6d2c3e; --tint-2:#58202f; --tint-soft:#f3e3e0; --tint-text:#6d2c3e; --on-tint:#ffffff;
  --gold:#c9a24a; --gold-2:#b8903a; --gold-ink:#7d5f22; --gold-line:rgba(184,144,58,.5); --gold-glow:rgba(201,162,74,.45);
  --glow1:rgba(185,139,122,.30); --glow2:rgba(217,191,165,.50); --ink-big2:#6d2c3e;
  --btn-bg:linear-gradient(135deg,#6d2c3e,#58202f); --btn-ink:#ffffff;
  --bar-a:#6d2c3e; --bar-b:#b98b7a; --bar-glow:rgba(109,44,62,.35); --col-a:#b98b7a; --col-b:#6d2c3e;
  --c1:#6d2c3e; --c2:#b98b7a; --c3:#c9a24a; --c4:#a8566e; --c5:#3f1a26; --c6:#e6c9c0;
  --ok:#2f6b4a; --ok-bg:#e3f1e8; --warn:#8f5e22; --warn-bg:#f8ecd9; --bad:#a23a42; --bad-bg:#f8e3e3; --idle-bg:#ece7e5;
  --font:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
html[data-theme="dark"]{
  --bg:#0d0709; --card:rgba(34,22,27,.66); --card-solid:#1d1317; --soft:rgba(255,255,255,.05); --track:rgba(255,255,255,.09);
  --ink:#f8efe8; --ink-2:#d2c4c6; --ink-3:#a99b9f; --line:rgba(255,255,255,.09); --hi:rgba(255,255,255,.07);
  --tint:#b04f70; --tint-2:#8f3c58; --tint-soft:rgba(176,79,112,.20); --tint-text:#eea9bd; --on-tint:#ffffff;
  --gold:#e2c487; --gold-2:#c9a24a; --gold-ink:#e2c487; --gold-line:rgba(226,196,135,.45); --gold-glow:rgba(226,196,135,.5);
  --glow1:rgba(214,100,140,.40); --glow2:rgba(201,162,74,.24); --ink-big2:#e9d3b6;
  --btn-bg:linear-gradient(135deg,#ecd49a,#c9a24a); --btn-ink:#2b1d22;
  --bar-a:#8f3c58; --bar-b:#e08aa5; --bar-glow:rgba(224,138,165,.55); --col-a:#d27a96; --col-b:#6d2c3e;
  --c1:#e2c487; --c2:#d27a96; --c3:#f1dcae; --c4:#9a3d5c; --c5:#b98b7a; --c6:#5a3a44;
  --ok:#8fd3ae; --ok-bg:#1f3a2d; --warn:#e8bd7a; --warn-bg:#40301a; --bad:#f0a3a8; --bad-bg:#47242a; --idle-bg:#33292c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
svg{display:block}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ───── Estrutura: sidebar + conteúdo ───── */
.app{display:flex;min-height:100vh}
.side{position:sticky;top:16px;height:calc(100vh - 32px);margin:16px 0 16px 16px;width:226px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 14px 16px;display:flex;flex-direction:column;transition:width .3s var(--ease);z-index:20}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px 22px}
.mark{width:36px;height:36px;border-radius:12px;background:var(--tint);color:var(--on-tint);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.logo b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.collapse{position:absolute;top:26px;right:-13px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer;display:grid;place-items:center;padding:0}
.collapse .ic{width:14px;height:14px;transition:transform .3s}
.nav{display:grid;gap:4px}
.nav button,.sb-btn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;cursor:pointer;padding:12px 14px;border-radius:14px;color:var(--ink-2);font-weight:600;font-size:15px;text-align:left;transition:background .2s,color .2s;text-decoration:none;white-space:nowrap}
.nav button:hover,.sb-btn:hover{background:var(--soft);color:var(--ink)}
.nav button.on{background:var(--tint);color:var(--on-tint);box-shadow:0 10px 22px -12px var(--tint)}
.sb-bottom{margin-top:auto;display:grid;gap:4px;padding-top:16px;border-top:1px solid var(--line)}
.theme{display:flex;gap:6px;background:var(--soft);border-radius:99px;padding:4px;width:max-content;margin:12px 6px 0}
.theme button{width:32px;height:32px;border-radius:50%;border:0;background:none;color:var(--ink-3);cursor:pointer;display:grid;place-items:center;padding:0}
.theme button.on{background:var(--tint);color:var(--on-tint)}
.side.collapsed{width:78px}
.side.collapsed .logo b,.side.collapsed .nav span,.side.collapsed .sb-btn span{display:none}
.side.collapsed .collapse .ic{transform:rotate(180deg)}
.side.collapsed .theme{flex-direction:column;border-radius:20px;margin-left:auto;margin-right:auto}
.main{flex:1;min-width:0;padding:24px 28px 60px;max-width:1260px}

/* ───── Topo ───── */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.top p{color:var(--ink-3);margin-top:4px;font-size:14px;font-weight:500}
.top-r{display:flex;align-items:center;gap:12px}
.ibtn{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--tint);color:var(--on-tint);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.who{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 16px 4px 4px}
.av{width:36px;height:36px;border-radius:50%;background:var(--tint-soft);color:var(--tint-text);display:grid;place-items:center;font-weight:800;font-size:13px}
.who b{display:block;font-size:14px;line-height:1.2}.who small{display:block;color:var(--ink-3);font-size:12px;line-height:1.2}

/* ───── Peças ───── */
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pillsel{position:relative;display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;color:var(--ink)}
.pillsel .ic{position:absolute;left:13px;pointer-events:none;color:var(--ink-3)}
.pillsel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:11px 34px 11px 38px;font-weight:600;cursor:pointer;border-radius:99px;max-width:100%}
.pillsel::after{content:"";position:absolute;right:15px;width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg) translateY(-2px);pointer-events:none}
.pillsel select option{color:#1f1518}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 20px;font-weight:700;font-size:14px;cursor:pointer;min-height:44px;transition:transform .15s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn.fill{background:var(--tint);border-color:var(--tint);color:var(--on-tint)}.btn.fill:hover{background:var(--tint-2)}
.btn.soft{background:var(--tint-soft);border-color:transparent;color:var(--tint-text)}
.btn.sm{padding:6px 14px;font-size:13px;min-height:32px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr);margin-bottom:16px}
.stat .card-h{flex-wrap:nowrap;align-items:flex-start}.stat .card-h .pill{flex:none;font-size:12px;padding:4px 10px}
.go{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit;transition:transform .25s var(--ease),border-color .2s}
.go:hover{transform:translateY(-3px);border-color:var(--tint)}.go:active{transform:scale(.98)}
.go .lnk{display:inline-flex;gap:6px;align-items:center;color:var(--tint-text);font-weight:700;font-size:13px;margin-top:14px}
.go .bar{margin-top:10px}
.parecer{white-space:pre-wrap;background:var(--soft);border-radius:14px;padding:16px}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-areas:"area donut" "bars donut";margin-top:16px}
.g-main .a{grid-area:area}.g-main .b{grid-area:bars}.g-main .d{grid-area:donut}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);align-items:start;margin-top:16px}
@media(max-width:1250px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.g4{grid-template-columns:1fr}}
@media(max-width:1100px){.g3{grid-template-columns:1fr}.g-main{grid-template-columns:1fr;grid-template-areas:"area" "bars" "donut"}.g2{grid-template-columns:1fr}}
.stat .big{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.stat .big small{font-size:22px;font-weight:700;color:var(--ink-3)}
.stat .cap{color:var(--ink-3);font-size:13px;min-height:19px}
.stat .mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.stat .mini b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .mini span{color:var(--ink-3);font-size:12.5px}
.chip{display:inline-flex;align-items:center;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;background:var(--tint-soft);color:var(--tint-text);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.idle{background:var(--idle-bg);color:var(--ink-2)}
.faint{color:var(--ink-3);font-size:13px}.muted{color:var(--ink-2)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}
.empty{text-align:center;padding:34px 16px;color:var(--ink-3);font-weight:500}
.notice{border-radius:18px;padding:14px 18px;margin-bottom:16px;background:var(--card);border:1px solid var(--line)}
.notice.warn{background:var(--warn-bg);border-color:transparent}.notice.bad{background:var(--bad-bg);border-color:transparent}
.notice h3{font-size:15px;font-weight:800;margin-bottom:2px}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:12.5px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:500}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 2s infinite}
.live.off i{background:var(--ink-3);animation:none}.live.busy i{background:var(--warn)}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(47,107,74,.45)}70%{box-shadow:0 0 0 8px rgba(47,107,74,0)}100%{box-shadow:0 0 0 0 rgba(47,107,74,0)}}
.sk{background:linear-gradient(90deg,var(--track) 25%,var(--soft) 50%,var(--track) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px;display:block}
@keyframes sh{to{background-position:-200% 0}}
#app.enter{animation:enter .4s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* gráficos */
.chart{position:relative}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-dasharray:3 5}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--font);font-weight:500}
.chart .ar{stroke:var(--c1);fill:none;stroke-width:2.5;stroke-linecap:round}
.chart .hl{stroke:var(--c1);stroke-dasharray:3 4;opacity:0}
.chart .hd{fill:var(--card);stroke:var(--c1);stroke-width:3;opacity:0}
.chart.on .hl,.chart.on .hd{opacity:1}
.tip{position:absolute;transform:translate(-50%,-125%);background:var(--card);border:1px solid var(--line);box-shadow:0 10px 24px -10px rgba(40,20,28,.3);border-radius:12px;padding:6px 12px;font-size:12.5px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:3}
.tip small{display:block;color:var(--ink-3);font-weight:500;font-size:11px}
.chart.on .tip{opacity:1}
.cols{display:flex;align-items:flex-end;gap:6px;height:190px}
.col{flex:1;height:100%;background:var(--track);border-radius:10px;position:relative;display:flex;align-items:flex-end;min-width:4px}
.col>i{display:block;width:100%;background:var(--c1);border-radius:10px;min-height:4px;transition:height .6s var(--ease)}
.col:hover>i{background:var(--c4)}
.col:hover::after{content:attr(data-t);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);box-shadow:0 10px 24px -10px rgba(40,20,28,.3);font-size:12px;font-weight:700;padding:4px 10px;border-radius:10px;white-space:nowrap;z-index:3}
.axis{display:flex;justify-content:space-between;color:var(--ink-3);font-size:12px;margin-top:8px;font-weight:500}
.legend{display:flex;gap:10px;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.lg i{width:9px;height:9px;border-radius:50%;background:var(--c1)}.lg i.t{background:var(--track);border:1px solid var(--line)}
.donut{display:grid;place-items:center;position:relative;margin:6px auto 14px;width:min(100%,230px)}
.donut svg{width:100%;height:auto}
.donut .mid{position:absolute;text-align:center;line-height:1.2}
.donut .mid small{display:block;color:var(--ink-3);font-size:12px;font-weight:500}.donut .mid b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.dl{display:grid;gap:10px}
.dl div{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.dl i{width:10px;height:10px;border-radius:50%;flex:none}.dl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dl em{font-style:normal;color:var(--ink-3);font-weight:600}

/* tabela */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;font-weight:600;color:var(--ink-3);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:14px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:500}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:190px;position:sticky;left:0;background:var(--card);font-weight:700}
tr:last-child td{border-bottom:0}
td .par{display:block;color:var(--ink-3);font-size:12px;font-weight:500}

/* implantação */
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--tint);border-radius:99px;transition:width .7s var(--ease)}
.bar.done>span{background:var(--ok)}
.step{padding:16px 0;border-top:1px solid var(--line)}.step:first-of-type{border-top:0;padding-top:4px}
.upd{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.upd:first-of-type{border-top:0}
.upd time{color:var(--ink-3);font-size:13px;font-weight:600}
.dlv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.dlv:first-of-type{border-top:0}
.dlv small{display:block;color:var(--ink-3);font-size:12.5px;font-weight:500}
.sub{font-size:12.5px;font-weight:700;color:var(--ink-3);margin:6px 0 4px}

/* drive */
.drive{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}
.folders{display:grid;gap:2px;padding:12px}
.folders a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink-2);cursor:pointer;font-weight:600}
.folders a:hover{background:var(--soft)}.folders a.on{background:var(--tint-soft);color:var(--tint-text)}
.files{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.file{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;transition:transform .3s var(--ease)}
.file:hover{transform:translateY(-3px)}.file:active{transform:scale(.98)}
.thumb{aspect-ratio:4/5;background:var(--track) center/cover no-repeat;position:relative;display:grid;place-items:center;color:var(--ink-3);font-weight:600}
.thumb .n{position:absolute;right:10px;top:10px;background:rgba(29,21,23,.65);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.file .m{padding:12px 14px 14px;display:grid;gap:7px;justify-items:start}.file .m strong{font-size:15px;font-weight:800}
.detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.stage{background:var(--track);border-radius:22px;display:grid;place-items:center;position:relative;overflow:hidden;min-height:320px}
.stage img{max-width:100%;max-height:640px;display:block}
.stage .ph{color:var(--ink-3);aspect-ratio:4/5;width:min(100%,420px);display:grid;place-items:center;font-weight:600}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);cursor:pointer;font-size:22px;color:#1f1518;box-shadow:0 2px 10px rgba(40,20,28,.2)}
.arrow.l{left:12px}.arrow.r{right:12px}
.strip{display:flex;gap:8px;overflow-x:auto;margin-top:12px}
.strip img{width:58px;height:74px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer}.strip img.on{border-color:var(--tint)}
.capbox{white-space:pre-wrap;background:var(--soft);border-radius:14px;padding:14px}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--soft);resize:vertical}
textarea:focus{outline:2px solid var(--tint)}
label.f>span{display:block;font-size:13px;color:var(--ink-3);margin-bottom:6px;font-weight:600}
.back{background:none;border:0;color:var(--tint-text);cursor:pointer;padding:0;margin-bottom:14px;font-size:15px;font-weight:700}

/* stories */
.story{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:start;padding:16px 0;border-top:1px solid var(--line)}
.story:first-of-type{border-top:0}
.story .n{width:32px;height:32px;border-radius:50%;background:var(--tint-soft);color:var(--tint-text);display:grid;place-items:center;font-weight:800;font-size:14px}
.story .t{white-space:pre-wrap}

<body>
<div class="app" id="shell">
  <aside class="side" id="side">
    <div class="logo"><span class="mark" id="mark">LM</span><b>Portal</b></div>
    <button class="collapse" id="collapse" aria-label="Recolher menu"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <nav class="nav" id="nav"></nav>
    <div class="sb-bottom">
      <button class="sb-btn" id="help"></button>
      <button class="sb-btn" id="reload"></button>
      <div class="theme" role="group" aria-label="Tema"><button id="th-l" aria-label="Claro"></button><button id="th-d" aria-label="Escuro"></button></div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="pt"></h1><p id="ps"></p></div>
      <div class="top-r"><button class="ibtn" id="bell" aria-label="Aprovações pendentes"></button><div class="who"><span class="av" id="av">LM</span><div><b id="nome">&nbsp;</b><small>Portal exclusivo</small></div></div></div>
    </header>
    <div id="app"></div>
  </main>
</div>

<script>/*PREVIEW*/</script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PREVIEW = window.__PREVIEW__ || null;
const KEY = new URLSearchParams(location.search).get("k") || "";
const TZ = "America/Sao_Paulo";
const dash = "—";

/* ───── ícones ───── */
const P = {
  resultados: '<path d="M5 20v-6M12 20V6M19 20v-9"/>',
  implantacao: '<path d="M5 21V4M5 4h12l-2.5 4L17 12H5"/>',
  drive: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  stories: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8M12 17h.01"/>',
  reload: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
  bell: '<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 21h4"/>',
  cal: '<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
};
const ic = (n) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const TABS = [["resultados", "Resultados", "Visão geral dos seus anúncios"], ["implantacao", "Implantação", "Andamento do seu funil e entregas"], ["drive", "Carrosséis", "Criativos para a sua aprovação"], ["stories", "Story vendedores", "Sequências prontas para publicar"]];

/* ───── formatação ───── */
const nInt = (n) => (n == null ? dash : new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 }).format(n));
const nCompact = (n) => new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 }).format(n);
const nMoney = (n, c = "BRL") => { if (n == null) return dash; try { return new Intl.NumberFormat("pt-BR", { style: "currency", currency: c }).format(n); } catch { return `${c} ${n.toFixed(2)}`; } };
const moneyBig = (n, c = "BRL") => {
  if (n == null) return dash;
  const s = nMoney(n, c), i = s.lastIndexOf(",");
  return i < 0 ? esc(s) : `${esc(s.slice(0, i))}<small>${esc(s.slice(i))}</small>`;
};
const nPct = (n) => (n == null ? dash : new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n) + "%");
const nDec = (n) => (n == null ? dash : n.toFixed(2).replace(".", ","));
const fDay = (d) => { const [, m, dd] = d.split("-"); return `${dd}/${m}`; };

async function api(path) {
  if (PREVIEW) return { ok: true, body: PREVIEW[path.split("?")[0].replace("/api/", "")] };
  const sep = path.includes("?") ? "&" : "?";
  try {
    const r = await fetch(`${path}${sep}k=${encodeURIComponent(KEY)}`, { cache: "no-store" });
    return { ok: r.ok, status: r.status, body: await r.json().catch(() => ({})) };
  } catch { return { ok: false, status: 0, body: { error: "Sem conexão." } }; }
}

/* ───── estado ───── */
let C = null, M = null, lastAt = null;
let preset = "last_7d", level = "campaign";
let folder = null, openItem = null, slideIdx = 0;
let metaErr = null, stale = false, locked = false;
let IG = null, igErr = null;
let tab = (location.hash || "#resultados").slice(1);
if (!TABS.some((t) => t[0] === tab)) tab = "resultados";
const PRESETS = [["today", "Hoje"], ["yesterday", "Ontem"], ["last_7d", "Últimos 7 dias"], ["last_14d", "Últimos 14 dias"], ["last_30d", "Últimos 30 dias"], ["this_month", "Este mês"], ["last_month", "Mês passado"], ["maximum", "Todo o período"]];
const LEVELS = [["campaign", "Campanhas"], ["adset", "Conjuntos"], ["ad", "Anúncios e impulsionamentos"]];

/* ───── casca ───── */
function mountShell() {
  $("#nav").innerHTML = TABS.map(([v, l]) => `<button data-v="${v}">${ic(v)}<span><b class="tl-f">${l}</b><b class="tl-s">${v === "stories" ? "Stories" : l}</b></span></button>`).join("");
  $("#help").innerHTML = ic("help") + "<span>Ajuda</span>";
  $("#reload").innerHTML = ic("reload") + "<span>Atualizar</span>";
  $("#th-l").innerHTML = ic("sun"); $("#th-d").innerHTML = ic("moon");
  $("#bell").innerHTML = ic("bell");
  document.querySelectorAll("#nav button").forEach((b) => (b.onclick = () => { tab = b.dataset.v; openItem = null; history.replaceState(null, "", "#" + tab); render(true); window.scrollTo({ top: 0 }); }));
  $("#collapse").onclick = () => $("#side").classList.toggle("collapsed");
  $("#reload").onclick = () => { loadMeta(); loadIG(); };
  $("#bell").onclick = () => { tab = "drive"; openItem = null; render(true); };
  $("#help").onclick = () => {
    if (PREVIEW) return;
    const n = (C?.whatsapp || "").replace(/\D/g, "");
    window.open(`https://wa.me/${n}?text=${encodeURIComponent("Olá! Preciso de ajuda com o portal.")}`, "_blank", "noopener");
  };
  const setTheme = (t) => { document.documentElement.dataset.theme = t; $("#th-l").classList.toggle("on", t === "light"); $("#th-d").classList.toggle("on", t === "dark"); try { localStorage.setItem("pm-theme", t); } catch {} };
  let saved = null; try { saved = localStorage.getItem("pm-theme"); } catch {}
  setTheme(saved || "dark");
  $("#th-l").onclick = () => setTheme("light"); $("#th-d").onclick = () => setTheme("dark");
}
function initials(name) {
  const w = String(name || "").split(/\s+/).filter((x) => x && !/^(dra?\.?|sr\.?|sra\.?)$/i.test(x) && !/^(de|di|da|do|dos|das)$/i.test(x));
  return ((w[0]?.[0] || "") + (w.length > 1 ? w[w.length - 1][0] : "")).toUpperCase() || "•";
}
function overall() {
  const e = C?.implantacao?.etapas || [];
  if (!e.length || e.some((x) => x.progresso == null)) return null;
  return Math.round(e.reduce((a, s) => a + (s.progresso || 0), 0) / e.length);
}
function renderTop() {
  const t = TABS.find((x) => x[0] === tab);
  $("#pt").textContent = t[1]; $("#ps").textContent = t[2];
  const nm = C?.cliente || ""; $("#nome").textContent = nm || " "; $("#av").textContent = initials(nm); $("#mark").textContent = initials(nm);
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.v === tab));
  const pend = (C?.drive?.itens || []).filter((i) => i.status === "em_revisao").length;
  $("#bell").innerHTML = ic("bell") + (pend ? `<span class="badge">${pend}</span>` : "");
}
function render(anim) {
  if (locked) return;
  renderTop();
  const app = $("#app");
  app.classList.remove("enter");
  if (anim) { void app.offsetWidth; app.classList.add("enter"); }
  const pv = PREVIEW ? `<div class="banner"><strong>Pré-visualização do layout.</strong> Nenhum número é real: valores aparecem como “—” e os nomes são espaços reservados.</div>` : "";
  app.innerHTML = pv + ({ resultados: vResultados, implantacao: vImplantacao, drive: vDrive, stories: vStories }[tab])();
  bind();
}

/* ───── gráficos ───── */
const CH = {};
function niceMax(v) { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; }
function areaChart(id, pts, fmt) {
  const W = 640, H = 240, pl = 46, pr = 12, pt = 16, pb = 28, iw = W - pl - pr, ih = H - pt - pb;
  const max = niceMax(Math.max(0, ...pts.map((p) => p.v || 0)));
  const x = (i) => pl + (pts.length < 2 ? iw / 2 : (iw * i) / (pts.length - 1));
  const y = (v) => pt + ih - ih * ((v || 0) / max);
  let g = "";
  for (let i = 0; i <= 4; i++) { const yy = pt + (ih * i) / 4; g += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}"/><text x="${pl - 8}" y="${yy + 4}" text-anchor="end">${pts.length ? nCompact(max * (1 - i / 4)) : dash}</text>`; }
  if (!pts.length) return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}<text x="${W / 2}" y="${H / 2}" text-anchor="middle" style="font-size:14px">${PREVIEW ? "O gráfico aparece aqui" : "Sem dados neste período"}</text></svg></div>`;
  const X = pts.map((_, i) => x(i)), Y = pts.map((p) => y(p.v));
  let d = `M${X[0]},${Y[0]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = i ? i - 1 : i, p3 = i + 2 < pts.length ? i + 2 : i + 1, cl = (v) => Math.min(pt + ih, Math.max(pt, v));
    d += ` C${X[i] + (X[i + 1] - X[p0]) / 6},${cl(Y[i] + (Y[i + 1] - Y[p0]) / 6)} ${X[i + 1] - (X[p3] - X[i]) / 6},${cl(Y[i + 1] - (Y[p3] - Y[i]) / 6)} ${X[i + 1]},${Y[i + 1]}`;
  }
  const area = `${d} L${X[X.length - 1]},${pt + ih} L${X[0]},${pt + ih} Z`;
  const step = Math.max(1, Math.ceil(pts.length / 7));
  const xl = pts.map((p, i) => (i % step === 0 || i === pts.length - 1 ? `<text x="${X[i]}" y="${H - 6}" text-anchor="middle">${esc(p.l)}</text>` : "")).join("");
  CH[id] = { pts, fmt, W, H, X, Y };
  return `<div class="chart" data-id="${id}"><svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="gr-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".28"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#gr-${id})"/><path class="ar" d="${d}"/>${xl}<line class="hl" y1="${pt}" y2="${pt + ih}" x1="0" x2="0"/><circle class="hd" r="6" cx="0" cy="0"/></svg><div class="tip"></div></div>`;
}
function donut(segs, center) {
  const R = 70, C2 = 2 * Math.PI * R, tot = segs.reduce((a, s) => a + s.v, 0);
  let off = 0, arcs = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--track)" stroke-width="24"/>`;
  if (tot > 0) for (const s of segs) { const len = (s.v / tot) * C2, gap = segs.length > 1 ? Math.min(4, len * 0.2) : 0; arcs += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${s.c}" stroke-width="24" stroke-dasharray="${Math.max(0, len - gap)} ${C2 - Math.max(0, len - gap)}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)" stroke-linecap="butt"/>`; off += len; }
  return `<div class="donut"><svg viewBox="0 0 200 200">${arcs}</svg><div class="mid">${center}</div></div>`;
}

/* ───── Resultados ───── */
const dayLabel = (d) => { const t = new Date(); return d.toDateString() === t.toDateString() ? "hoje" : new Intl.DateTimeFormat("pt-BR", { timeZone: TZ, day: "2-digit", month: "2-digit" }).format(d); };
function stat(title, pillTxt, big, cap, mini) {
  return `<div class="card stat"><div class="card-h" style="margin-bottom:6px"><h3>${title}</h3><span class="pill">${pillTxt}</span></div><div class="big">${big}</div><div class="cap">${cap || ""}</div><div class="mini">${mini.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("")}</div></div>`;
}
function gauge(p) {
  const L = Math.PI * 80, v = p == null ? 0 : Math.max(0, Math.min(100, p));
  return `<svg class="gauge" viewBox="0 0 200 122" role="img" aria-label="Funil montado: ${p == null ? "sem dado" : p + "%"}"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="var(--bar-a)"/><stop offset=".55" stop-color="var(--bar-b)"/><stop offset="1" stop-color="var(--gold)"/></linearGradient></defs><path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--track)" stroke-width="16" stroke-linecap="round"/>${v > 0 ? `<path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${(L * v) / 100} ${L}" style="filter:drop-shadow(0 0 8px var(--gold-glow))"/>` : ""}<text class="gn" x="100" y="94" text-anchor="middle" font-size="44" fill="var(--ink)">${p == null ? dash : p + "%"}</text><text x="100" y="114" text-anchor="middle" font-size="12" fill="var(--ink-3)">do funil montado</text></svg>`;
}
function igNote() {
  if (igErr?.code === "not_configured") return "Instagram ainda não conectado.";

  document.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => { tab = b.dataset.go; openItem = null; history.replaceState(null, "", "#" + tab); render(true); window.scrollTo({ top: 0 }); }));
  const sp = $("#sel-p"); if (sp) sp.onchange = () => { preset = sp.value; useCache(); IG = null; igErr = null; render(); loadMeta(); loadIG(); };
  const sl = $("#sel-l"); if (sl) sl.onchange = () => { level = sl.value; useCache(); render(); loadMeta(); };
  document.querySelectorAll(".chart[data-id]").forEach((el) => {
    const c = CH[el.dataset.id]; if (!c) return;
    const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), hl = el.querySelector(".hl"), hd = el.querySelector(".hd");
    const move = (ev) => {
      const r = svg.getBoundingClientRect(), px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * c.W;
      let bi = 0, bd = 1e9; c.X.forEach((xx, i) => { const dd = Math.abs(xx - px); if (dd < bd) { bd = dd; bi = i; } });
      hl.setAttribute("x1", c.X[bi]); hl.setAttribute("x2", c.X[bi]); hd.setAttribute("cx", c.X[bi]); hd.setAttribute("cy", c.Y[bi]);
      tip.style.left = (c.X[bi] / c.W) * 100 + "%"; tip.style.top = (c.Y[bi] / c.H) * 100 + "%";
      tip.innerHTML = `${esc(c.fmt(c.pts[bi].v))}<small>${esc(c.pts[bi].l)}</small>`; el.classList.add("on");
    };
    el.addEventListener("mousemove", move); el.addEventListener("touchmove", move, { passive: true }); el.addEventListener("touchstart", move, { passive: true });
    el.addEventListener("mouseleave", () => el.classList.remove("on"));
  });
  document.querySelectorAll("[data-f]").forEach((a) => (a.onclick = () => { folder = a.dataset.f || null; render(); }));
  document.querySelectorAll(".file").forEach((f) => (f.onclick = () => { openItem = f.dataset.id; slideIdx = 0; render(true); }));
  const bk = $("#back"); if (bk) bk.onclick = () => { openItem = null; render(true); };
  const go = (d) => { const c = C.drive.itens.find((i) => i.id === openItem); slideIdx = Math.max(0, Math.min((c.slides || []).length - 1, slideIdx + d)); render(); };
  const pv = $("#prev"), nx = $("#next"); if (pv) pv.onclick = () => go(-1); if (nx) nx.onclick = () => go(1);
  document.querySelectorAll(".strip img").forEach((i) => (i.onclick = () => { slideIdx = +i.dataset.i; render(); }));
  const wa = (kind) => {
    if (PREVIEW) return;
    const c = C.drive.itens.find((i) => i.id === openItem), cm = ($("#cm").value || "").trim();
    if (kind === "aj" && cm.length < 3) { $("#cm").focus(); return; }
    const txt = kind === "ok" ? `Olá! Revisei "${c.titulo}" e está APROVADO. ✓${cm ? "\nObs.: " + cm : ""}` : `Olá! Revisei "${c.titulo}" e gostaria de alguns ajustes:\n${cm}`;
    const n = (C.whatsapp || "").replace(/\D/g, "");
    window.open(`https://wa.me/${n}?text=${encodeURIComponent(txt)}`, "_blank", "noopener");
  };
  const ok = $("#ok"), aj = $("#aj"); if (ok) ok.onclick = () => wa("ok"); if (aj) aj.onclick = () => wa("aj");
}
document.addEventListener("keydown", (e) => { if (tab === "drive" && openItem != null) { if (e.key === "ArrowRight") $("#next")?.click(); if (e.key === "ArrowLeft") $("#prev")?.click(); } });

/* ───── Início: desenha na hora, busca conteúdo e Meta ao mesmo tempo ───── */
(async function init() {
  mountShell();
  useCache();
  render();
  const metaP = loadMeta(); loadIG();
  const r = await api("/api/conteudo");
  if (!r.ok) {
    locked = true;
    $("#shell").innerHTML = `<div class="lock"><div><h2>Link privado</h2><p class="muted" style="margin-top:8px">${r.status === 401 ? "Este link não é válido. Use o link completo que foi enviado para você." : "Não consegui carregar agora. Tente novamente em instantes."}</p></div></div>`;
    return;
  }
  C = r.body;
  render();
  await metaP;
  setInterval(() => { if (document.visibilityState === "visible") { loadMeta(); loadIG(); } }, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { loadMeta(); loadIG(); } });
})();
</script>
